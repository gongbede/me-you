<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B6BFF" />
    <title>You're offline · Me&You</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #0b1f44;
        background: #eff6ff;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(90%, 28rem);
        padding: 2rem;
        border: 1px solid #dbeafe;
        border-radius: 1.25rem;
        background: #fff;
        text-align: center;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        color: #fff;
        background: #0b6bff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Me&You needs a connection to load this page. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
