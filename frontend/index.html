<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn · Connect · Grow" />
    <meta name="theme-color" content="#0B6BFF" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Me&You</title>
    <script>
      (() => {
        let choice = 'system'
        try {
          const stored = localStorage.getItem('me-you-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored
        } catch {
          // Use the system theme when browser storage is unavailable.
        }
        const prefersDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches
        const dark = choice === 'dark' || (choice === 'system' && prefersDark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0B1F44' : '#0B6BFF'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
