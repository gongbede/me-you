services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: me_you
      POSTGRES_USER: me_you
      POSTGRES_PASSWORD: placeholder-local-password
    ports:
      - "5432:5432"
    volumes:
      - me_you_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U me_you -d me_you"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-me_you_local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-me_you_local_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - me_you_minio_data:/data

volumes:
  me_you_postgres_data:
  me_you_minio_data: